<!DOCTYPE html>
<html lang='de'>
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>
        <title>Speicher M01 - Hauptmenü</title>
        <link rel='stylesheet' href='einst.css'>
    </head>
    <body>
        <div class='hauptseite'>
            <div>
                <h2>Speicher M01</h2>
            </div>
            <div class='field'>
                <div class='eintrag'>Akku U:<span class='wert1' id='sp'>-1</span><span class='einheit1'>V</span>
                </div>
                <div class='eintrag'>Akku SOC:<span class='wert1' id='lz'>100</span><span class='einheit1'>%</span>
                </div>
                <div class='eintrag'>Akku I:<span class='wert1' id='s1'>-1</span><span class='einheit1'>A</span>
                </div>
                <div class='eintrag' id='s2d'>PV I:<span class='wert1' id='s2'>-1</span><span class='einheit1'>A</span>
                </div>
                <div class='eintrag' id='tpd'>Temperatur:<span class='wert1' id='tp'>-1</span><span class='einheit1'>°C</span>
                </div>
                <div class='eintrag' id='dtd'>Datum:<span class='wert1 wert2' id='dt'>-1</span>
                </div>
                <div class='eintrag' id='ztd'>Zeit:<span class='wert1 wert2' id='zt'>-1</span>
                </div>
                <div class='eintrag'>Laden:<span class='wert1 wert2' id='la'>-1</span>
                </div>
                <div class='eintrag'>Entladen:<span class='wert1 wert2' id='el'>-1</span>
                </div>
            </div>
            <div class='taste'>
            </div>
            <div class='taste taste2fach'>
                <form id=but2 action='/' method='post'><button class='button1' name='bef' value='lad'>Laden</button>
                </form>
                <form id=but2 action='/' method='post'><button class='button2' name='bef' value='ent'>Entladen</button>
                </form>
            </div>
            <div class='taste'>
                <form id=but2 class='db' action='/' method='post'><button name='bef' value='spa'>Speicher aus</button>
                </form>
            </div>
            <div class='taste'>
                <form id=but2 class='db' action='/' method='post'><button name='bef' value='md'>mehr Daten</button>
                </form>
            </div>
            <div class='taste'>
                <form id=but1 class='db' action='einst' method='post'><button>Einstellungen</button>
                </form>
            </div>
            <div class='abstand'>
                <form id=but0 class='db' action='/' method='post' onsubmit='return confirm("Wirklich neustarten?");'>
                    <button name='rst' class='bred'>Neustart</button>
                </form>
            </div>
            <div class='imp'>
                <hr/>
                <a class='projekt' href='https://github.com/MartinDienert/Venus2Mqtt' target='_blank'>Speicher2Mqtt 0.2 von Martin Dienert</a>
            </div>
        </div>
    </body>
    <script>
        let eB=s=>document.getElementById(s);
        let to;
        function dho(){
            clearTimeout(to);
            to=setTimeout(()=>{
                dho();
            },3000);
            let x=new XMLHttpRequest();
            x.overrideMimeType('application/json');
            x.open('GET','/daten.json',true);
            x.onreadystatechange=()=>{
                if(x.readyState==4&&x.status==200){
                    sD(x.responseText);
                }
            };
            x.send();
        }
        function sD(t){
            od = JSON.parse(t);
            eB('sp').innerHTML=od.Spannung;
            eB('lz').innerHTML=od.Ladezustand;
            eB('s1').innerHTML=od.StromAkku;
            eB('s2').innerHTML=od.StromPV;
            eB('tp').innerHTML=od.Temperatur;
            if(od.Typ=='1'){
                eB('s2d').style.display='none';
                eB('tpd').style.display='none';
            }else{
                eB('s2d').style.display='flex';
                eB('tpd').style.display='flex';
            }
            eB('dt').innerHTML=od.Datum;
            if(od.Datum=='')
                eB('dtd').style.display='none';
            else
                eB('dtd').style.display='flex';
            eB('zt').innerHTML=od.Zeit;
            if(od.Zeit=='')
                eB('ztd').style.display='none';
            else
                eB('ztd').style.display='flex';
            eB('la').innerHTML=od.Laden;
            eB('el').innerHTML=od.Entladen;
        }
        dho();
    </script>
</html>
