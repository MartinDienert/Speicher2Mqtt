<!DOCTYPE html>
<html lang='de'>
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'/>
        <link rel="stylesheet" href="einst.css">
        <title>Speicher M01 - allgemeine Einstellungen</title>
    </head>
    <body>
        <div class='hauptseite'>
            <div>
                <h2>Speicher M01</h2>
            </div>
            <div class='field'>
                <div class='fieldlabel'>allgemeine Einstellungen</div>
                <form method='post' action='einst'>
                    <div class='taste'>
                        <label for="ma">als Master</label>
                        <input type="checkbox" id="ma" name="ma">
                    </div>
                    <div class='taste'>
                        <label for="md">mehr Daten</label>
                        <input type="checkbox" id="md" name="md">
                    </div>
                    <div class='taste'>
                        <label for="ntip">NTZ - Server</label>
                        <input id='ntip' placeholder='de.pool.ntp.org' name='ntip' value=''>
                    </div>
                    <div class='taste abstand'>
                        <button name='save' value='ei' type='submit' class='button bgrn'>Speichern</button>
                    </div>
                </form>
            </div>
            <div class='taste abstand'>
                <form class='db' action='einst' method='post'><button>Einstellungen</button></form>
            </div>
            <div class='taste'>
                <form class='db' action='/' method='post'><button>Hauptfenster</button></form>
            </div>
            <div class='imp'>
                <hr/>
                <a class='projekt' href='https://github.com/MartinDienert/Venus2Mqtt' target='_blank'>Speicher2Mqtt 0.2 von Martin Dienert</a>
            </div>
        </div>
    </body>
    <script>
        let eB=s=>document.getElementById(s);
        function dho(){
            let x=new XMLHttpRequest();
            x.overrideMimeType('application/json');
            x.open('GET','/einst.json',true);
            x.onreadystatechange=()=>{
                if(x.readyState==4&&x.status==200){
                    sD(x.responseText);
                }};
            x.send();
        }
        function sD(t){
            od = JSON.parse(t);
            eB('ma').checked=od.Master;
            eB('md').checked=od.mDaten;
            eB('ntip').value=od.NtzIp;
        }
        dho();
    </script>
</html>
